# Preview por PR: sobe uma versão do Worker (sem promover para produção) com o alias
# `pr-<n>` e comenta a URL no PR. A URL fica fixa enquanto o PR existir:
# https://pr-<n>-<worker>.<subdomínio>.workers.dev
# Precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. `versions upload` só
# funciona com o Worker já criado: se nenhum deploy de produção deu certo ainda, este workflow
# publica antes a branch principal (nunca o código do PR), que cria o Worker e liga as preview URLs.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Um preview por PR; um push novo cancela o anterior.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PRs de fork e do Dependabot não recebem os secrets: pula em vez de falhar.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.urls.outputs.url }}
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No próprio repositório-template (sem conta da Cloudflare) a falta dos secrets só pula o
      # deploy; nos repositórios criados a partir dele, falha explicando o que configurar.
      - name: Verificar secrets da Cloudflare
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_IF_MISSING: ${{ github.event.repository.is_template }}
        run: .github/scripts/require-cloudflare-secrets.sh

      - name: Nome do Worker
        if: steps.secrets.outputs.ready == 'true'
        id: worker
        env:
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          name="$(.github/scripts/worker-name.sh "$REPO_NAME")"
          # O host do preview é <alias>-<worker>: um label de DNS tem no máximo 63 caracteres.
          if [ $(( ${#PREVIEW_ALIAS} + 1 + ${#name} )) -gt 63 ]; then
            echo "::warning title=Nome do Worker longo::'$PREVIEW_ALIAS-$name' passa de 63 caracteres; a URL de preview pode não ser criada. Use um nome mais curto na variável CLOUDFLARE_WORKER_NAME."
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # Usa a versão do pnpm fixada em `packageManager` no package.json.
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # `wrangler versions upload` falha com "You cannot upload a new version of a Worker that
      # does not yet exist" antes do primeiro deploy de produção (ex.: o 1º PR de um repositório
      # recém-criado, ou um PR aberto enquanto o Deploy de `main` ainda falhava).
      - name: Worker já existe?
        if: steps.secrets.outputs.ready == 'true'
        id: exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ steps.worker.outputs.name }}
        run: .github/scripts/worker-exists.sh "$WORKER"

      # Sem Worker: publica a branch principal (o mesmo que o workflow Deploy faria no próximo
      # push em `main`) para criá-lo. O código do PR nunca vai para produção.
      - name: Primeiro deploy (checkout da branch principal)
        if: steps.secrets.outputs.ready == 'true' && steps.exists.outputs.exists == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .preview-bootstrap
          persist-credentials: false

      - name: Primeiro deploy (install + build da branch principal)
        if: steps.secrets.outputs.ready == 'true' && steps.exists.outputs.exists == 'false'
        working-directory: .preview-bootstrap
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Primeiro deploy (wrangler deploy da branch principal)
        if: steps.secrets.outputs.ready == 'true' && steps.exists.outputs.exists == 'false'
        id: bootstrap
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: .preview-bootstrap
          command: deploy --name ${{ steps.worker.outputs.name }}

      # Tira a cópia da branch principal antes do build do PR (o Tailwind varre o projeto).
      - name: Primeiro deploy (limpeza)
        if: always() && steps.exists.outputs.exists == 'false'
        run: rm -rf .preview-bootstrap

      # lint/typecheck/testes já rodam no workflow de CI do PR.
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm build

      - name: Upload da versão (wrangler versions upload)
        if: steps.secrets.outputs.ready == 'true'
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: >-
            versions upload
            --name ${{ steps.worker.outputs.name }}
            --preview-alias ${{ env.PREVIEW_ALIAS }}
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      # O wrangler-action resume a falha como "pnpm failed with exit code 1"; o erro real do
      # wrangler fica no log do passo e numa anotação logo acima. Aqui só explicamos o que fazer.
      - name: Dica se o wrangler falhar
        if: failure() && (steps.upload.outcome == 'failure' || steps.bootstrap.outcome == 'failure')
        env:
          WORKER: ${{ steps.worker.outputs.name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
        run: |
          auth="Se for erro de autenticação, confira se o CLOUDFLARE_API_TOKEN foi criado com o template 'Edit Cloudflare Workers' e se o CLOUDFLARE_ACCOUNT_ID é da mesma conta."
          if [ "$BOOTSTRAP" = "failure" ]; then
            echo "::error title=Falha no primeiro deploy::O Worker '$WORKER' não existia e o deploy da branch '$BASE_REF' para criá-lo falhou (veja o erro do wrangler no passo 'Primeiro deploy (wrangler deploy da branch principal)'). $auth Depois de corrigir, rode o workflow Deploy (Actions → Deploy → Run workflow) ou faça um novo push no PR."
          else
            echo "::error title=Falha no upload do preview::O 'wrangler versions upload' do Worker '$WORKER' falhou (veja o erro do wrangler no passo 'Upload da versão'). Se o erro diz que o Worker não existe, rode o workflow Deploy (Actions → Deploy → Run workflow) e depois este de novo. $auth"
          fi

      - name: URL do preview
        if: steps.secrets.outputs.ready == 'true'
        id: urls
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
          WORKER: ${{ steps.worker.outputs.name }}
        run: |
          url="$(sed -nE 's/.*Version Preview Alias URL: (https:\/\/[^[:space:]]+).*/\1/p' <<<"$OUTPUT" | head -n1)"
          version_url="$(sed -nE 's/.*Version Preview URL: (https:\/\/[^[:space:]]+).*/\1/p' <<<"$OUTPUT" | head -n1)"
          if [ -z "$url" ]; then
            echo "::error title=Preview URL não gerada::A versão subiu, mas a Cloudflare não devolveu a URL de preview. As preview URLs do Worker '$WORKER' precisam estar ligadas: faça um deploy de produção (merge em main ou rode o workflow Deploy) com 'preview_urls: true' no wrangler.jsonc."
            exit 1
          fi
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "version_url=$version_url" >>"$GITHUB_OUTPUT"
          {
            echo "## 🔎 Preview"
            echo
            echo "- PR: $url"
            [ -z "$version_url" ] || echo "- Esta versão: $version_url"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Comentar a URL no PR
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.urls.outputs.url }}
          VERSION_URL: ${{ steps.urls.outputs.version_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // Um único comentário por PR, atualizado a cada push (achado pelo marcador).
            const marker = "<!-- foreman-landing-preview -->";
            const { PREVIEW_URL, VERSION_URL, HEAD_SHA } = process.env;
            const lines = [
              marker,
              "### 🔎 Preview do site",
              "",
              `**${PREVIEW_URL}**`,
              "",
              `Atualizado no commit \`${HEAD_SHA.slice(0, 7)}\`. A URL acima é fixa e acompanha os próximos pushes deste PR.`,
            ];
            if (VERSION_URL) lines.push("", `Só esta versão: ${VERSION_URL}`);
            const body = lines.join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Depois do comentário: no 1º push de um PR, DNS/TLS do alias novo pode levar alguns minutos.
      - name: Smoke test (200 + CTA wa.me)
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.urls.outputs.url }}
          SMOKE_ATTEMPTS: "30"
        run: .github/scripts/smoke-test.sh "$URL"
