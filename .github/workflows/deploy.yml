# Publica o site na Cloudflare (Workers, só static assets):
# - push em `production` → environment `production`, Worker `<nome>`;
# - push em `staging` (opcional) → environment `staging`, Worker `<nome>-staging`.
# Também roda à mão (Actions → Deploy → Run workflow) numa dessas duas branches; o Elfo dispara
# o primeiro deploy assim, logo depois de conectar a Cloudflare.
# Precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID, que o Elfo grava (veja "Deploy" no README).
name: Deploy

on:
  push:
    branches: [production, staging]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por environment de cada vez; o próximo espera o atual terminar (não cancela no meio).
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Deploy manual numa branch que não é `production` nem `staging`: falha explicando, sem
  # criar um deployment em nenhum environment.
  branch:
    if: github.ref != 'refs/heads/production' && github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Branch sem deploy
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Branch sem deploy::'$REF' não publica nada. Rode o Deploy na branch 'production' (produção) ou 'staging' (staging)."
          exit 1

  deploy:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O Elfo lê os deployments dos environments `production` e `staging` (com a `url`) para
    # mostrar as URLs no board: os nomes têm que ser exatamente esses.
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.urls.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No próprio repositório-template (sem conta da Cloudflare) a falta dos secrets só pula o
      # deploy; nos repositórios criados a partir dele, falha explicando o que conectar no Elfo.
      - name: Verificar secrets da Cloudflare
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_IF_MISSING: ${{ github.event.repository.is_template }}
        run: .github/scripts/require-cloudflare-secrets.sh

      # Produção: Worker `<nome>` com a config do topo do wrangler.jsonc (domínio próprio, se houver);
      # `--env=""` escolhe o topo explicitamente (sem ele o wrangler avisa que há outros environments).
      # Staging: Worker `<nome>-staging` com `--env staging` (sem `routes`: o domínio próprio fica
      # sempre na produção).
      - name: Nome do Worker
        if: steps.secrets.outputs.ready == 'true'
        id: worker
        env:
          ENVIRONMENT: ${{ github.ref_name }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$ENVIRONMENT" = "staging" ]; then
            name="$(.github/scripts/worker-name.sh "$REPO_NAME" -staging)"
            echo "args=--name $name --env staging" >>"$GITHUB_OUTPUT"
            echo "label=Staging" >>"$GITHUB_OUTPUT"
          else
            name="$(.github/scripts/worker-name.sh "$REPO_NAME")"
            echo "args=--name $name --env=\"\"" >>"$GITHUB_OUTPUT"
            echo "label=Produção" >>"$GITHUB_OUTPUT"
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "Worker: $name ($ENVIRONMENT)"

      # Usa a versão do pnpm fixada em `packageManager` no package.json.
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check (lint + typecheck + test)
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm check

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm build

      - name: Deploy (wrangler deploy)
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy ${{ steps.worker.outputs.args }}

      # `workers_dev_url`: testado no smoke test. `url` (environment): o domínio próprio,
      # se houver um em wrangler.jsonc, senão a URL do workers.dev.
      - name: URLs publicadas
        if: steps.secrets.outputs.ready == 'true'
        id: urls
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          LABEL: ${{ steps.worker.outputs.label }}
          WORKER: ${{ steps.worker.outputs.name }}
        run: |
          workers_dev="$(grep -v 'Preview URL' <<<"$OUTPUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -n1 || true)"
          workers_dev="${workers_dev:-$DEPLOYMENT_URL}"
          custom="$(grep -oE '^[[:space:]]*[a-z0-9.-]+ \(custom domain\)' <<<"$OUTPUT" | head -n1 | awk '{print $1}' || true)"
          if [ -z "$workers_dev" ]; then
            echo "::error title=URL do workers.dev não encontrada::Confira se 'workers_dev' está true no wrangler.jsonc e se a conta tem um subdomínio workers.dev (painel da Cloudflare → Workers & Pages)."
            exit 1
          fi
          url="${custom:+https://$custom}"
          url="${url:-$workers_dev}"
          echo "workers_dev_url=$workers_dev" >>"$GITHUB_OUTPUT"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          {
            echo "## 🚀 Publicado ($LABEL)"
            echo
            echo "- $LABEL: $url"
            [ "$url" = "$workers_dev" ] || echo "- workers.dev: $workers_dev"
            echo "- Worker: \`$WORKER\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test (200 + CTA wa.me)
        if: steps.secrets.outputs.ready == 'true'
        env:
          URL: ${{ steps.urls.outputs.workers_dev_url }}
        run: .github/scripts/smoke-test.sh "$URL"
